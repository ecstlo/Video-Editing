[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vedit"
version = "0.1.0"
description = "Scriptable video editor for viral clips and real-estate videos (FFmpeg + Whisper)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]

[project.scripts]
vedit = "vedit.cli:main"

[tool.setuptools]
packages = ["vedit"]
